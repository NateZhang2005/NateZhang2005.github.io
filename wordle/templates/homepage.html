<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- https://favicon.io/emoji-favicons/money-bag/ -->
        <link href="/static/favicon.ico" rel="icon">

        <link href="/static/styles.css" rel="stylesheet">

        <title>Wurdle{% block title %}{% endblock %}</title>

    </head>

    <body>
        {% block body %}
        <span class="centerpiece">
                <div class="buttons">
                    <form action="/makerselect" method="post">
                        <button class="button" type="submit">CREATE</button>
                    </form>
                </div>
        </span>
        <div id="popup" class="popup">
            <div class="popup__content">
                <p id="popupMessage"></p>
                <button class="button" id="popupClose" type="button">OK</button>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const message = localStorage.getItem('wurdleError');
                if (message) {
                    const popup = document.getElementById('popup');
                    const popupMessage = document.getElementById('popupMessage');
                    const popupClose = document.getElementById('popupClose');

                    popupMessage.textContent = message;
                    popup.classList.add('show');
                    popupClose.addEventListener('click', () => {
                        popup.classList.remove('show');
                    });
                    localStorage.removeItem('wurdleError');
                }
            });
        </script>
        {% endblock %}
    </body>

</html>

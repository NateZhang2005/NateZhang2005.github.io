{% extends "homepage.html" %}

{% block body %}

    <span class="centerpiece">
        <div class="buttons">
            <form action="/maker" method="post" onsubmit="storeValues()">
                <div id="setup">
                    <input type="text" id="customWord" placeholder="Word" name="customWord" class="form__field">
                    <input type="number" id="guessCount" name="guessCount" placeholder="Number of guesses" min="1" max="10">
                    <select id = "realWord" name="realWord" required>
                        <option disabled selected value="">Real Wordle Word?</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                    <button type="submit" class="button">Start Game</button>
                </div>
            </form>
        </div>
    </span>

    <script>
        // stores values from the form on the page
        function storeValues() {
            const word = document.getElementById('customWord').value;
            const guesses = parseInt(document.getElementById('guessCount').value);
            const real = document.getElementById('realWord').value;
            localStorage.setItem('customWord', word);
            localStorage.setItem('guessCount', guesses);
            localStorage.setItem('realWord', real);
        }
    </script>
{% endblock %}
